<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDYON</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #333333;
            line-height: 1.7;
            padding: 64px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 560px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #1A3633;
            font-size: 32px;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .tagline {
            color: #666666;
            font-size: 15px;
            margin-bottom: 48px;
        }
        h2 {
            color: #1A3633;
            font-size: 18px;
            margin-top: 40px;
            margin-bottom: 16px;
            text-align: left;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-card {
            display: block;
            padding: 16px 20px;
            background: #f7f8f8;
            border: 1px solid #e0e4e4;
            border-radius: 8px;
            color: #1A3633;
            text-decoration: none;
            text-align: left;
            transition: background 0.15s;
        }
        .link-card:hover { background: #eef0f0; }
        .link-card .label { font-weight: 600; font-size: 15px; }
        .link-card .desc { color: #666; font-size: 13px; margin-top: 2px; }
        footer {
            margin-top: 64px;
            color: #999999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GDYON</h1>
        <p class="tagline">Bağımsız yazılım stüdyosu</p>

        <h2>Nağme</h2>
        <div class="links">
            <a class="link-card" href="privacy-policy.html">
                <div class="label">Gizlilik Politikası</div>
                <div class="desc">Türkçe</div>
            </a>
            <a class="link-card" href="privacy-policy-en.html">
                <div class="label">Privacy Policy</div>
                <div class="desc">English</div>
            </a>
        </div>

        <footer>© 2026 GDYON</footer>
    </div>
</body>
</html>
