<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1b100e">
  <link rel="icon" href="data:,">
  <title>Çay Ocağı</title>
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      height: 100dvh;
      background:
        radial-gradient(ellipse at 50% 38%, #9e735b25, #140b0b75 80%),
        repeating-linear-gradient(90deg, #221414 0 2px, transparent 2px 119px),
        repeating-linear-gradient(89deg, #3d2720 0 3px, #39231e 4px 7px, #402820 8px 12px);
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    main {
      position: relative;
      width: min(100vw, 56.25vh);
      width: min(100vw, 56.25dvh);
      aspect-ratio: 9 / 16;
    }
    canvas { display: block; width: 100%; height: 100%; }
    button {
      position: absolute;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible { outline: 3px solid #fff4cd; outline-offset: -5px; }
    button:disabled { cursor: default; }
    .okuyucu {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <canvas aria-label="Çay Ocağı oyun alanı"></canvas>
    <div id="dugmeler"></div>
    <div id="durum" class="okuyucu" role="status"></div>
  </main>
  <script>
    'use strict';

    const RULES = {
      width: 540,
      height: 960,
      teaRatios: { light: 0.25, ruby: 0.45, strong: 0.65, brew: 1 },
      orders: [
        { id: 'light', tea: 'light' },
        { id: 'ruby', tea: 'ruby' },
        { id: 'strong', tea: 'strong' },
        { id: 'brew', tea: 'brew' },
        { id: 'mug', tea: 'ruby', fillScale: 0.72, target: 0.88 },
        { id: 'hurry', tea: 'light', deadlineMs: 5500 },
        { id: 'brim', tea: 'ruby', target: 0.95 }
      ],
      targetLevel: 0.85,
      fillSeconds: 2.2,
      speedIncrease: 0.06,
      ratioTolerance: 0.25,
      levelTolerance: 0.15,
      ratioWeight: 0.5,
      scoreTiers: { perfect: 95, veryGood: 80, good: 60 },
      glassLimit: 10,
      mistakeLimit: 3,
      orderAnimationMs: 350,
      orderWaitMs: 600,
      resultMs: 1500,
      recordingTitleMs: 2500,
      happytimePerfects: 8,
      framesPerSecond: 30,
      liquidColorStops: [
        [0.00, [246, 236, 214, 0.18]],
        [0.12, [230, 170, 70, 0.62]],
        [0.25, [214, 122, 34, 0.80]],
        [0.45, [170, 44, 22, 0.86]],
        [0.65, [92, 20, 10, 0.93]],
        [1.00, [40, 8, 4, 0.97]]
      ],
      recordingTypes: [
        'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9',
        'video/webm;codecs=vp8', 'video/webm'
      ]
    };

    const WORDS = {
      tr: {
        name: 'Çay Ocağı', subtitle: '', area: 'Çay Ocağı oyun alanı', start: 'Başla',
        help: 'Nasıl oynanır?', back: 'Geri', menu: 'Ana menü', pause: 'Duraklat', paused: 'Duraklatıldı',
        resume: 'Devam', soundOn: 'Ses: açık', soundOff: 'Ses: kapalı',
        day: n => `Gün ${n}`, glass: 'Bardak', mistakes: 'Hata', points: 'Puan',
        brew: 'Dem', water: 'Sıcak su', hold: 'Basılı tut', release: 'Bırak',
        guide: ['İlk tutuşta dem dök, bırak.', 'İkinci tutuşta sıcak su ekle.', 'Çizgiye yaklaşınca bırak ve servis et.'],
        good: 'İyi', veryGood: 'Çok iyi', perfect: 'Tam kıvamında!', bad: 'Bu çay mı?',
        spilled: 'Taştı!', late: 'Süre doldu!', color: 'Renk', fill: 'Doluluk',
        end: 'Gün sonu', total: 'Toplam puan', perfectCount: 'Tam kıvamında', replay: 'Yeniden oyna',
        best: 'En iyi bardağı indir', worst: 'En kötü bardağı indir',
        noClips: 'Bu gün kesit kaydedilemedi.', unsupported: 'Kesit kaydı desteklenmiyor.',
        format: format => `Kesit biçimi: ${format}`, code: code => `Kesit kodu: ${code}`,
        lines: ['Her zamankinden.', 'Eline sağlık şimdiden.', 'Kolay gelsin.', 'Bir çay alayım.', 'Afiyetle içerim.'],
        orders: {
          light: ['Açık olsun', 'Açık çay istedi.'],
          ruby: ['Tavşan kanı', 'Tavşan kanı istedi.'],
          strong: ['Demli olsun', 'Demli istedi.'],
          brew: ['Sadece dem', 'Sadece dem istedi.'],
          mug: ['Büyük kupa,\ntavşan kanı', 'Büyük kupada tavşan kanı istedi.', 'Daha yavaş dolar.'],
          hurry: ['Acelem var,\naçık olsun', 'Acelesi var, açık çay istedi.', 'Süre dolmadan servis et.'],
          brim: ['Ağzına kadar\ntavşan kanı', 'Ağzına kadar tavşan kanı istedi.', 'Çizgi ağza yakın.']
        }
      },
      en: {
        name: 'Çay Ocağı', subtitle: 'Turkish Tea House', area: 'Çay Ocağı game area', start: 'Play',
        help: 'How to play', back: 'Back', menu: 'Main menu', pause: 'Pause', paused: 'Paused',
        resume: 'Resume', soundOn: 'Sound: on', soundOff: 'Sound: off',
        day: n => `Day ${n}`, glass: 'Cup', mistakes: 'Mistakes', points: 'Score',
        brew: 'Brew', water: 'Hot water', hold: 'Hold', release: 'Let go',
        guide: ['Hold to pour the brew, then let go.', 'Hold again to add hot water.', 'Let go at the line to serve.'],
        good: 'Good', veryGood: 'Very good', perfect: 'Just right!', bad: 'Is this tea?',
        spilled: 'Spilled!', late: 'Time’s up!', color: 'Color', fill: 'Fill',
        end: 'Day over', total: 'Total score', perfectCount: 'Just right', replay: 'Play again',
        best: 'Download best cup', worst: 'Download worst cup',
        noClips: 'No clips were recorded today.', unsupported: 'Clip recording is unavailable.',
        format: format => `Clip format: ${format}`, code: code => `Clip code: ${code}`,
        lines: ['The usual, please.', 'Thanks in advance.', 'Hope your shift goes well.', 'I’ll have a tea.', 'Looking forward to it.'],
        orders: {
          light: ['Light tea', 'They asked for light tea.'],
          ruby: ["Rabbit's blood\n(ruby red)", 'They asked for ruby-red tea.'],
          strong: ['Strong tea', 'They asked for strong tea.'],
          brew: ['Just the brew', 'They asked for just the brew.'],
          mug: ['Big mug,\nruby-red tea', 'Ruby-red tea in a big mug.', 'The mug fills more slowly.'],
          hurry: ['In a hurry —\nlight tea', 'They want light tea, fast.', 'Serve before time runs out.'],
          brim: ['Ruby-red tea\nto the brim', 'Ruby-red tea, filled to the brim.', 'The line is near the rim.']
        }
      }
    };

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const controls = document.querySelector('#dugmeler');
    const status = document.querySelector('#durum');
    const query = new URLSearchParams(location.search);
    const clipCode = query.get('k');
    const cream = '#fff0d3';
    const gold = '#e9b876';
    const glassTop = 424;
    const glassBottom = 729;
    const buttons = [];
    let words = WORDS.tr;
    let state = 'loading';
    let day = 0;
    let session = null;
    let pausedFrom = null;
    let pausedAt = 0;
    let pausedMs = 0;
    let adPending = false;
    let adPlaying = false;
    let sdkMuted = false;
    let dayOrders = [];
    let customerIndex = 0;
    let dayCustomers = [];
    const seenOrders = new Set();
    let firstOrder = false;
    let glassNo = 0;
    let mistakes = 0;
    let totalScore = 0;
    let perfects = 0;
    let order = RULES.orders[0];
    let stage = 1;
    let tea = 0;
    let water = 0;
    let level = 0;
    let pour = null;
    let result = null;
    let lastResult = null;
    let glassStartedAt = 0;
    let titleStartedAt = 0;
    let firstPour = false;
    let resultAt = 0;
    let recordingType = '';
    let recording = null;
    let cupFrames = 0;
    let audio = null;
    let soundOn = true;
    let droplets = [];
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clamp = value => Math.min(1, Math.max(0, value));
    const clock = () => (pausedFrom ? pausedAt : performance.now()) - pausedMs;
    const targetLevel = () => order.target ?? RULES.targetLevel;
    const targetRatio = () => RULES.teaRatios[order.tea];
    const orderText = () => words.orders[order.id][0].replace('\n', ' ');
    const tutorial = () => day === 1 && glassNo <= 3;

    function resizeBackingCanvas() {
      const unit = Math.max(2, 2 * Math.round(30 * (window.devicePixelRatio || 1)));
      canvas.width = unit * 9;
      canvas.height = unit * 16;
      ctx.setTransform(canvas.width / RULES.width, 0, 0, canvas.height / RULES.height, 0, 0);
    }

    function roundedRect(x, y, w, h, radius, fill, stroke) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
    }

    function ellipse(x, y, rx, ry, fill) {
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.fill();
    }

    function label(value, x, y, size, options = {}) {
      const { color = cream, align = 'center', weight = 600, serif = false, maxWidth } = options;
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px ${serif ? 'Georgia, serif' : 'system-ui, sans-serif'}`;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';
      if (maxWidth) ctx.fillText(value, x, y, maxWidth);
      else ctx.fillText(value, x, y);
    }

    function gradient(x, y, x2, y2, stops) {
      const value = ctx.createLinearGradient(x, y, x2, y2);
      for (const [at, color] of stops) value.addColorStop(at, color);
      return value;
    }

    function backdrop() {
      ctx.fillStyle = gradient(0, 0, 540, 960, [[0, '#2d1716'], [0.58, '#523024'], [1, '#291713']]);
      ctx.fillRect(0, 0, 540, 960);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(44, 699);
      ctx.lineTo(44, 308);
      ctx.bezierCurveTo(44, 111, 496, 111, 496, 308);
      ctx.lineTo(496, 699);
      ctx.closePath();
      ctx.fillStyle = gradient(0, 190, 0, 730, [[0, '#362021'], [1, '#673b29']]);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#82513a';
      ctx.stroke();
      ctx.clip();
      const glow = ctx.createRadialGradient(270, 438, 14, 270, 438, 320);
      glow.addColorStop(0, '#ce875c50');
      glow.addColorStop(1, '#ce875c00');
      ctx.fillStyle = glow;
      ctx.fillRect(44, 147, 452, 554);
      ctx.strokeStyle = '#e9b87619';
      for (let row = 0; row < 4; row++) {
        const y = 493 + row * 57;
        ctx.beginPath();
        ctx.moveTo(44, y);
        ctx.lineTo(496, y);
        for (let x = 44 + (row % 2) * 47; x < 496; x += 94) {
          ctx.moveTo(x, y);
          ctx.lineTo(x, y + 57);
        }
        ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = gradient(0, 686, 0, 809, [[0, '#a75d39'], [0.3, '#774027'], [1, '#4a2922']]);
      ctx.fillRect(0, 686, 540, 123);
      ctx.fillStyle = '#d6905d65';
      ctx.fillRect(0, 686, 540, 3);
      ctx.fillStyle = '#2c1716';
      ctx.fillRect(0, 805, 540, 155);
      ctx.fillStyle = '#c47f5448';
      ctx.fillRect(0, 806, 540, 2);
    }

    const customers = [
      ['#deb18b', '#68756b', '#39231e', 'glasses'],
      ['#ba805e', '#8a4741', '#30201a', 'cap'],
      ['#f0c6a4', '#605777', '#7c3f2c', 'bun'],
      ['#cc9576', '#3e6f73', '#b19b84', 'moustache'],
      ['#a86d50', '#a76d43', '#2e231f', 'earrings']
    ];

    function customer(expression) {
      const [skin, shirt, hair, detail] = customers[customerIndex];
      ctx.save();
      ctx.translate(99, 239);
      roundedRect(-57, 30, 114, 66, 29, shirt);
      roundedRect(-13, 28, 26, 34, 12, skin);
      ellipse(-38, 5, 8, 12, skin);
      ellipse(38, 5, 8, 12, skin);
      ellipse(0, 0, 40, 44, skin);
      ctx.beginPath();
      ctx.moveTo(-39, 2);
      ctx.bezierCurveTo(-52, -51, 25, -69, 39, -21);
      ctx.quadraticCurveTo(43, -9, 39, 1);
      ctx.quadraticCurveTo(25, -32, 7, -27);
      ctx.quadraticCurveTo(-15, -13, -32, -14);
      ctx.closePath();
      ctx.fillStyle = hair;
      ctx.fill();
      if (detail === 'bun') ellipse(33, -29, 17, 23, hair);
      if (detail === 'cap') {
        ellipse(0, -32, 42, 19, shirt);
        ellipse(11, -20, 38, 5, '#472825');
      }
      const surprised = expression === 'saskin';
      const happy = expression === 'mutlu';
      for (const x of [-14, 14]) {
        ellipse(x, -1, surprised ? 3.6 : 2.9, surprised ? 5 : 3.4, '#341d17');
        ellipse(x * 1.65, 12, 6, 3.5, '#b957503c');
      }
      if (detail === 'glasses') {
        ctx.lineWidth = 2.5;
        roundedRect(-27, -9, 24, 17, 5, null, '#38251d');
        roundedRect(3, -9, 24, 17, 5, null, '#38251d');
        roundedRect(-4, -3, 8, 2, 0, '#38251d');
      }
      if (detail === 'moustache') ellipse(0, 12, 13, 3, hair);
      if (detail === 'earrings') {
        ellipse(-39, 15, 4, 6, gold);
        ellipse(39, 15, 4, 6, gold);
      }
      ctx.strokeStyle = '#6f342b';
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      if (surprised) ctx.ellipse(0, 19, 5, 6, 0, 0, Math.PI * 2);
      else {
        ctx.moveTo(-8, 17);
        ctx.quadraticCurveTo(0, happy ? 29 : 20, 8, 17);
      }
      ctx.stroke();
      ctx.restore();
    }

    function orderBubble(now) {
      const age = now - glassStartedAt;
      const progress = clamp(age / RULES.orderAnimationMs);
      const [text, , explanation] = words.orders[order.id];
      const lines = text.split('\n');
      const showColor = day === 1 || firstOrder;
      const description = tutorial() ? '' : (firstOrder && explanation ? explanation : words.lines[customerIndex]);
      const titleY = (description ? 227 : 242) - (lines.length - 1) * 17;
      ctx.save();
      if (!reduceMotion) ctx.translate(0, 9 * (1 - progress) ** 3);
      ctx.beginPath();
      ctx.moveTo(178, 230);
      ctx.lineTo(151, 245);
      ctx.lineTo(178, 251);
      ctx.fillStyle = '#f8e6cb';
      ctx.fill();
      roundedRect(171, 181, 344, 124, 21, '#f8e6cb');
      lines.forEach((line, i) => label(line, showColor ? 360 : 343, titleY + i * 34, 34,
        { color: '#49251e', maxWidth: showColor ? 286 : 322, weight: 750 }));
      if (showColor) {
        const swatchY = titleY + (lines.length - 1) * 17;
        ellipse(197, swatchY, 13, 13, '#c49d7f');
        ellipse(197, swatchY, 11, 11, liquidColor(targetRatio()));
      }
      if (description) label(description, 343, 280, 27, { color: '#613c2c', maxWidth: 322 });
      ctx.restore();
      if (order.deadlineMs) {
        const time = result ? resultAt : now;
        const remaining = clamp(1 - (time - glassStartedAt - RULES.orderWaitMs) / order.deadlineMs);
        roundedRect(175, 319, 336, 11, 5, '#301a18');
        if (remaining) roundedRect(175, 319, 336 * remaining, 11, 5, remaining > 0.25 ? gold : '#ff7e67');
      }
    }

    function hud() {
      roundedRect(91, 20, 424, 70, 15, '#241415', '#754c3c');
      label(words.day(day), 151, 55, 25, { weight: 750, maxWidth: 106 });
      const stats = [
        [words.glass, `${glassNo}/${RULES.glassLimit}`],
        [words.mistakes, `${mistakes}/${RULES.mistakeLimit}`],
        [words.points, totalScore]
      ];
      stats.forEach(([name, value], i) => {
        const x = 258 + i * 101;
        label(name, x, 38, 24, { color: '#f1cbb0' });
        label(value, x, 67, 28, { weight: 750 });
      });
    }

    function glassContour() {
      ctx.beginPath();
      if (order.id === 'mug') {
        ctx.roundRect(148, glassTop, 244, glassBottom - glassTop, [9, 9, 30, 30]);
        return;
      }
      ctx.moveTo(189, glassTop);
      ctx.bezierCurveTo(187, 478, 235, 513, 226, 572);
      ctx.bezierCurveTo(223, 621, 194, 657, 202, 702);
      ctx.bezierCurveTo(209, glassBottom + 15, 331, glassBottom + 15, 338, 702);
      ctx.bezierCurveTo(346, 657, 317, 621, 314, 572);
      ctx.bezierCurveTo(305, 513, 353, 478, 351, glassTop);
      ctx.closePath();
    }

    function liquidColor(ratio = level ? tea / level : 0, opacity = 1) {
      const stops = RULES.liquidColorStops;
      const boundedRatio = Math.max(0, Math.min(1, ratio));
      const upperIndex = stops.findIndex(([at], i) => i > 0 && boundedRatio <= at);
      const [lowerRatio, lowerColor] = stops[upperIndex - 1];
      const [upperRatio, upperColor] = stops[upperIndex];
      const fraction = (boundedRatio - lowerRatio) / (upperRatio - lowerRatio);
      const [red, green, blue, alpha] = lowerColor.map((channel, i) =>
        channel + (upperColor[i] - channel) * fraction
      );
      return `rgba(${Math.round(red)},${Math.round(green)},${Math.round(blue)},${alpha * opacity})`;
    }

    function glass(now, fill = level, ratio = level ? tea / level : 0) {
      ellipse(270, 745, 167, 35, '#351b1790');
      ellipse(270, 732, 164, 38, '#d5a37d');
      ellipse(270, 725, 159, 34, '#f5dcaf');
      ellipse(270, 728, 127, 23, '#bf7956');
      ellipse(270, 724, 119, 21, '#eec391');
      if (result?.tasti) {
        ellipse(271, 730, 125, 20, liquidColor());
        ellipse(374, 741, 24, 5, liquidColor());
      }
      const mug = order.id === 'mug';
      if (mug) {
        ctx.beginPath();
        ctx.arc(390, 520, 50, -Math.PI / 2, Math.PI / 2);
        ctx.strokeStyle = '#fff1d682';
        ctx.lineWidth = 13;
        ctx.stroke();
      }
      glassContour();
      ctx.fillStyle = '#fff1d621';
      ctx.fill();
      const mark = glassBottom - (glassBottom - glassTop) * targetLevel();
      if (fill > 0) {
        const surface = glassBottom - (glassBottom - glassTop) * clamp(fill);
        const wave = reduceMotion ? 0 : (pour ? 4 : 1.3) * Math.sin(now / 103);
        ctx.save();
        ctx.clip();
        ctx.beginPath();
        ctx.moveTo(144, surface);
        ctx.bezierCurveTo(229, surface + wave, 285, surface - wave, 396, surface);
        ctx.lineTo(396, glassBottom + 20);
        ctx.lineTo(144, glassBottom + 20);
        ctx.closePath();
        ctx.fillStyle = liquidColor(ratio);
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = gradient(244, 0, 257, 0, [
          [0, 'rgba(255,255,255,0)'], [0.4, 'rgba(255,255,255,0.13)'], [1, 'rgba(255,255,255,0)']
        ]);
        ctx.fillRect(244, surface - 4, 13, glassBottom - surface + 24);
        ctx.restore();
        ctx.beginPath();
        ctx.moveTo(144, surface);
        ctx.bezierCurveTo(229, surface + wave, 285, surface - wave, 396, surface);
        ctx.strokeStyle = 'rgba(255,235,198,0.45)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }
      glassContour();
      ctx.strokeStyle = '#fff1d69c';
      ctx.lineWidth = 3;
      ctx.stroke();
      ellipse(270, glassTop, mug ? 122 : 81, 11, '#fff1d62b');
      ctx.strokeStyle = '#fff1d6c8';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      if (mug) {
        ctx.moveTo(167, 446);
        ctx.lineTo(167, 680);
      } else {
        ctx.moveTo(206, 445);
        ctx.bezierCurveTo(209, 477, 245, 515, 239, 567);
        ctx.moveTo(235, 617);
        ctx.quadraticCurveTo(207, 681, 219, 699);
      }
      ctx.strokeStyle = '#fff5dd91';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.stroke();
      if (state !== 'baslangic' && state !== 'loading' && state !== 'help') {
        const width = mug ? 228 : 148;
        const accent = mug ? '#95e1d1' : '#fff0b3';
        if (tutorial()) roundedRect(270 - width / 2, mark - 10, width, 20, 5, '#f8c96a45');
        ctx.beginPath();
        ctx.moveTo(270 - width / 2, mark);
        ctx.lineTo(270 + width / 2, mark);
        ctx.setLineDash(mug ? [13, 7] : [7, 6]);
        ctx.strokeStyle = accent;
        ctx.lineWidth = tutorial() ? 4 : 3;
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.lineCap = 'butt';
    }

    function kettle(now) {
      const spout = new Path2D('M45 52 Q21 48 7 33 L0 41 Q16 65 40 77 Z');
      const teaPot = stage === 1;
      const top = teaPot ? 39 : 23;
      const metal = teaPot ? '#a84f38' : '#ad8c70';
      ctx.save();
      ctx.translate(266, 307);
      ctx.strokeStyle = '#221514';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.ellipse(130, 59, 25, 23, 0, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();
      ctx.fillStyle = metal;
      ctx.fill(spout);
      roundedRect(36, top, 101, 95 - top, teaPot ? 26 : 18,
        gradient(40, top, 120, 96, [[0, '#e7b48a'], [0.33, metal], [1, '#5b3029']]), '#f7c09375');
      ellipse(85, top + 2, teaPot ? 31 : 38, 7, '#412927');
      ellipse(85, top - 7, 8, 7, '#382322');
      ctx.restore();
      const flowBottom = Math.min(glassBottom, glassBottom - (glassBottom - glassTop) * level + 4);
      const end = Math.max(glassTop, flowBottom);
      const drift = reduceMotion ? 0 : Math.sin(now / 64) * 2;
      ctx.beginPath();
      ctx.moveTo(270, 346);
      ctx.quadraticCurveTo(291 + drift, 403, 272, end);

    const soundEnabled = () => soundOn && !sdkMuted && !adPlaying;

    function applyAudioSettings() {
      if (audio) {
        const at = audio.context.currentTime;
        audio.master.gain.setTargetAtTime(soundEnabled() ? 0.64 : 0, at, 0.009);
      }
      for (const { button } of buttons) {

          button.setAttribute('aria-pressed', String(soundEnabled()));

    function unlockAudio() {
      try {
        if (!audio) {
          const AudioEngine = window.AudioContext || window.webkitAudioContext;
          if (!AudioEngine) return;
          const context = new AudioEngine();
          const master = context.createGain();
          const compressor = context.createDynamicsCompressor();
          compressor.threshold.value = -16;
          compressor.ratio.value = 4;
          master.gain.value = soundEnabled() ? 0.64 : 0;
          master.connect(compressor).connect(context.destination);
          const duration = context.sampleRate * 2;
          const brown = context.createBuffer(1, duration, context.sampleRate);
          const white = context.createBuffer(1, duration, context.sampleRate);
          const brownSamples = brown.getChannelData(0);
          const whiteSamples = white.getChannelData(0);
          let integrated = 0;
          for (let i = 0; i < duration; i++) {
            whiteSamples[i] = Math.random() * 2 - 1;
            integrated = 0.985 * integrated + 0.025 * whiteSamples[i];
            brownSamples[i] = integrated * 2.8;
          }
          const seam = integrated * 2.8;
          for (let i = 0; i < duration; i++) brownSamples[i] -= seam * i / (duration - 1);
          audio = { context, master, brown, white, flow: null };
        }
        if (audio.context.state !== 'running') audio.context.resume().catch(() => {});
      } catch {
        // Ses aygıtı kullanılamadığında oyun devam eder.
      }
    }

    function tone(output, at, frequency, glide, amplitude, duration) {
      const { context } = audio;
      const source = context.createOscillator();
      const volume = context.createGain();
      source.frequency.setValueAtTime(frequency, at);
      source.frequency.exponentialRampToValueAtTime(frequency * glide, at + duration * 0.53);
      volume.gain.setValueAtTime(0, at);
      volume.gain.linearRampToValueAtTime(amplitude, at + 0.002);
      volume.gain.exponentialRampToValueAtTime(0.0001, at + duration);
      volume.gain.linearRampToValueAtTime(0, at + duration + 0.003);
      source.connect(volume).connect(output);
      source.onended = () => { source.disconnect(); volume.disconnect(); };
      source.start(at);
      source.stop(at + duration + 0.004);
    }

    function bubble(output, at, brew) {
      const frequency = brew ? 940 + 2060 * Math.random() ** 1.3 : 500 + 2300 * Math.random() ** 1.8;
      tone(output, at, frequency, 1.10 + Math.random() * 0.20, 0.018 + Math.random() * 0.052,
        0.014 + Math.random() * 0.026);
    }

    function cavityFrequency() {
      // Çeyrek dalga yaklaşımı. Ağız etkisi için en kısa boşluk sınırlandırılır.
      return 300 / Math.max(0.2, 1 - level * 0.8);
    }

    function startPourSound() {
      if (!audio) return;
      const { context, master } = audio;
      const at = context.currentTime;
      const source = context.createBufferSource();
      const filter = context.createBiquadFilter();
      const air = context.createGain();
      const volume = context.createGain();
      const brew = stage === 1;
      const rate = brew ? 38 : 76;
      source.buffer = audio.brown;
      source.loop = true;
      filter.type = 'bandpass';
      filter.frequency.value = cavityFrequency();
      filter.Q.value = 1.7;
      air.gain.value = brew ? 0.20 : 0.29;
      volume.gain.setValueAtTime(0, at);
      volume.gain.linearRampToValueAtTime(1, at + 0.043);
      source.connect(filter).connect(air).connect(volume).connect(master);
      source.onended = () => { source.disconnect(); filter.disconnect(); air.disconnect(); volume.disconnect(); };
      source.start(at, Math.random());
      let next = at;
      const schedule = () => {
        if (context.state !== 'running') return;
        const current = context.currentTime;
        next = Math.max(next, current);
        while (next < current + 0.075) {
          next += -Math.log(1 - Math.random()) / rate;
          bubble(volume, next, brew);
        }
      };
      audio.flow = { source, filter, volume, timer: setInterval(schedule, 28) };
      schedule();
    }

    function stopPourSound() {
      if (!audio?.flow) return;
      const { source, volume, timer } = audio.flow;
      const at = audio.context.currentTime;
      clearInterval(timer);
      if (volume.gain.cancelAndHoldAtTime) volume.gain.cancelAndHoldAtTime(at);
      else {
        const gain = volume.gain.value;
        volume.gain.cancelScheduledValues(at);
        volume.gain.setValueAtTime(gain, at);
      }
      volume.gain.linearRampToValueAtTime(0, at + 0.055);
      source.stop(at + 0.058);
      audio.flow = null;
    }

    function serveSound(tier) {
      if (!audio) return;
      const { context, master } = audio;
      const at = context.currentTime;
      if (tier === 'spilled') {
        const source = context.createBufferSource();
        const gain = context.createGain();
        source.buffer = audio.white;
        gain.gain.setValueAtTime(0, at);
        gain.gain.linearRampToValueAtTime(0.24, at + 0.009);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.11);
        source.connect(gain).connect(master);
        source.onended = () => { source.disconnect(); gain.disconnect(); };
        source.start(at, Math.random(), 0.115);
        for (let i = 0; i < 7; i++) bubble(master, at + Math.random() * 0.135, false);
        for (const delay of [0.14, 0.23, 0.36]) {
          tone(master, at + delay, 680 + Math.random() * 310, 1.24, 0.048, 0.052);
          tone(master, at + delay, 290, 1, 0.025, 0.027);
        }
        return;
      }
      if (tier === 'late') return;
      tone(master, at, 265, 0.86, 0.16, 0.035);
      tone(master, at, 630, 0.92, 0.075, 0.024);
      if (tier === 'perfect') {
        const partials = [[2410, 0.088], [3910, 0.054], [5620, 0.035], [7320, 0.018]];
        for (const [delay, strength] of [[0.08, 1], [0.174, 0.63]]) {
          partials.forEach(([frequency, amplitude], i) =>
            tone(master, at + delay, frequency, 1, amplitude * strength, 0.13 - i * 0.018));
        }
      }
    }

    // Platform erişimi bu sarmalayıcıda kalır.
    const cg = {
      sdk: null,
      active: false,
      environment: 'unavailable',
      async init() {
        const sdk = window.CrazyGames?.SDK;
        if (!sdk) return;
        try {
          // Bazı SDK sürümleri ortam bilgisini yalnız init sonrasında açar.
          let knownEnvironment;
          try { knownEnvironment = sdk.environment; } catch { /* init gerekli */ }
          if (knownEnvironment === 'disabled') {
            this.environment = knownEnvironment;
            return;
          }
          await sdk.init();
          this.environment = sdk.environment;
          if (this.environment === 'local' || this.environment === 'crazygames') this.sdk = sdk;
        } catch {
          // Çevrimdışı ve bağımsız oynanış.
        }
      },
      call(operation) {
        if (!this.sdk) return;
        try { return operation(this.sdk); } catch { return undefined; }
      },
      loadingStart() { this.call(sdk => sdk.game.loadingStart()); },
      loadingStop() { this.call(sdk => sdk.game.loadingStop()); },
      gameplayStart() {
        if (this.active) return;
        this.active = true;
        this.call(sdk => sdk.game.gameplayStart());
      },
      gameplayStop() {
        if (!this.active) return;
        this.active = false;
        this.call(sdk => sdk.game.gameplayStop());
      },
      settings(listener) {
        this.call(sdk => listener(sdk.game.settings));
        this.call(sdk => sdk.game.addSettingsChangeListener(listener));
      },
      systemInfo() { return this.call(sdk => sdk.user.systemInfo); },
      happytime() { this.call(sdk => sdk.game.happytime()); },
      midgame(started, done) {
        if (!this.sdk) { done(); return; }
        try {
          const request = this.sdk.ad.requestAd('midgame', {
            adStarted: started, adFinished: done, adError: done
          });
          request?.catch?.(done);
        } catch {
          done();
        }
      }
    };

    function recordingFormat(type = recordingType) {
      return type.split(';')[0].split('/')[1] || '';
    }

    function prepareRecording() {
      recordingType = '';
      if (!canvas.captureStream || typeof window.MediaRecorder?.isTypeSupported !== 'function') return;
      recordingType = RULES.recordingTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';
    }

    function recordGlass() {
      if (!recordingType) return;
      const owner = session;
      const cup = glassNo;
      const id = `${owner.day}:${cup}`;
      let stream;
      try {
        stream = canvas.captureStream(RULES.framesPerSecond);
        const recorder = new MediaRecorder(stream, { mimeType: recordingType });
        const clip = { recorder, result: null };
        const chunks = [];
        let settle;
        const finished = new Promise(resolve => { settle = resolve; });
        let closed = false;
        const close = save => {
          if (closed) return;
          closed = true;
          stream.getTracks().forEach(track => track.stop());
          if (recording === clip) recording = null;
          if (save && owner === session && clip.result && chunks.length) {
            const type = chunks[0].type || recorder.mimeType;
            owner.clips.push({ ...clip.result, id, blob: new Blob(chunks, { type }), format: recordingFormat(type) });
          }
          settle();
        };
        recorder.addEventListener('dataavailable', e => {
          if (e.data.size) chunks.push(e.data);
        });
        recorder.addEventListener('error', () => close(false), { once: true });
        recorder.addEventListener('stop', () => close(true), { once: true });
        clip.close = close;
        recorder.start();
        recording = clip;
        owner.pending.push(finished);
      } catch {
        stream?.getTracks().forEach(track => track.stop());
      }
    }

    function stopRecording(keepResult) {
      if (!recording) return;
      const clip = recording;
      recording = null;
      clip.result = keepResult ? result : null;
      if (clip.recorder.state !== 'inactive') {
        try { clip.recorder.stop(); } catch { clip.close(false); }
      }
    }

    function download(clip, name) {
      const link = document.createElement('a');
      const url = URL.createObjectURL(clip.blob);
      link.href = url;
      link.download = `cay-ocagi-${name}.${clip.format}`;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }

    function seededRandom(seed) {
      return () => {
        seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
        return seed / 4294967296;
      };
    }

    function planDay() {
      const random = seededRandom(Math.imul(day, 0x9e3779b1));
      const unlocked = ['light', 'ruby', 'strong', 'mug'];
      if (day >= 2) unlocked.push('hurry');
      if (day >= 3) unlocked.push('brim');
      const opening = day === 1 ? ['brew', 'light', 'ruby', 'mug', 'strong']
        : day === 2 ? ['ruby', 'hurry'] : ['light', 'brim', 'hurry', 'mug'];
      dayOrders = Array.from({ length: RULES.glassLimit }, (_, i) => {
        const id = opening[i] ?? unlocked[Math.floor(random() * unlocked.length)];
        return RULES.orders.find(orderType => orderType.id === id);
      });
      dayCustomers = [];
      while (dayCustomers.length < RULES.glassLimit) {
        const group = customers.map((_, i) => i);
        for (let i = group.length - 1; i > 0; i--) {
          const other = Math.floor(random() * (i + 1));
          [group[i], group[other]] = [group[other], group[i]];
        }
        if (group[0] === dayCustomers.at(-1)) [group[0], group[1]] = [group[1], group[0]];
        dayCustomers.push(...group);
      }
    }

      if (session.clips.length && session.ready) {
        const regularClips = session.clips.filter(clip => clip.gun !== 1 || clip.bardak > 3);
        const eligibleClips = regularClips.length ? regularClips : session.clips;
        const ordered = [...eligibleClips].sort((a, b) => a.bardak - b.bardak);
        const best = ordered.reduce((a, b) => b.puan > a.puan ? b : a);
        const worst = ordered.find(clip => clip.tasti) || ordered.reduce((a, b) => b.puan < a.puan ? b : a);
        registerButton(words.best, 550, () => download(best, 'iyi'), { secondary: true });
        registerButton(words.worst, 644, () => download(worst, 'kotu'), { secondary: true });
      }
      registerButton(words.menu, 738, showMainMenu, { secondary: true });

    function endDay() {
      const owner = session;
      state = 'gunSonu';
      cg.gameplayStop();
      if (mistakes === 0 && perfects >= RULES.happytimePerfects) cg.happytime();
      status.textContent = `${words.end}. ${words.total} ${totalScore}. ${words.perfectCount} ${perfects}.`;
      showSummaryControls();
      Promise.all(owner.pending).then(() => {
        if (session !== owner || state !== 'gunSonu') return;
        owner.ready = true;
        showSummaryControls();
        if (adPending) buttons.forEach(({ button }) => { button.disabled = true; });
      });
    }

    function replay() {
      if (adPending || state !== 'gunSonu') return;
      adPending = true;
      let finished = false;
      buttons.forEach(({ button }) => { button.disabled = true; });
      draw(clock());
      const started = () => {
        if (finished) return;
        adPlaying = true;
        applyAudioSettings();
      };
      const done = () => {
        if (finished) return;
        finished = true;
        adPlaying = false;
        adPending = false;
        applyAudioSettings();
        startDay();
      };
      cg.midgame(started, done);
    }

    function beginPour(input, now, until = Infinity, resolved = null) {
      if (state !== 'oyun' || pour || now - glassStartedAt < RULES.orderWaitMs) return false;
      advancePour(now);
      if (state !== 'oyun') return false;
      if (!firstPour) {
        firstPour = true;
        if (now - glassStartedAt > RULES.recordingTitleMs) {
          stopRecording(false);
          titleStartedAt = now;
          cupFrames = 0;
        }
      }
      const speed = (1 + RULES.speedIncrease) ** (glassNo - 1) * (order.fillScale ?? 1) / RULES.fillSeconds;
      pour = { input, started: now, until, resolved, speed, baseTea: tea, baseWater: water };
      startPourSound();
      return true;
    }

    function cancelPour() {
      const active = pour;
      pour = null;
      stopPourSound();
      active?.resolved?.();
    }

    function advancePour(now) {
      if (state !== 'oyun') return;
      const deadline = order.deadlineMs ? glassStartedAt + RULES.orderWaitMs + order.deadlineMs : Infinity;
      if (pour) {
        const { started, until, speed, baseTea, baseWater } = pour;
        const end = Math.max(started, Math.min(now, until, deadline));
        const capacity = Math.max(0, 1 - baseTea - baseWater);
        const volume = speed * (end - started) / 1000;
        const amount = Math.min(volume, capacity);
        tea = baseTea + (stage === 1 ? amount : 0);
        water = baseWater + (stage === 2 ? amount : 0);
        level = tea + water;
        if (volume > capacity + 1e-10) {
          finishGlass(started + capacity * 1000 / speed, 'spilled');
          return;
        }
        if (audio?.flow) {
          audio.flow.filter.frequency.setTargetAtTime(cavityFrequency(), audio.context.currentTime, 0.028);
        }
        if (pour.until <= now && pour.until < deadline) {
          completePour(pour.until);
          return;
        }
      }
      if (now >= deadline) finishGlass(deadline, 'late');
    }

    function completePour(now) {
      cancelPour();
      if (!level) return;
      if (stage === 1 && order.id !== 'brew') {
        stage = 2;
        status.textContent = words.water;
      } else {
        finishGlass(now);
      }
    }

    function releasePour(input, now, serve = true) {
      if (pour?.input !== input) return;
      advancePour(now);
      if (pour?.input !== input) return;
      if (serve) completePour(now);
      else cancelPour();
    }

    function finishGlass(now, failure) {
      cancelPour();
      const ratio = level ? tea / level : 0;
      const color = clamp(1 - Math.abs(ratio - targetRatio()) / RULES.ratioTolerance);
      const fill = clamp(1 - Math.abs(level - targetLevel()) / RULES.levelTolerance);
      const score = failure ? 0 : Math.round(100 * (RULES.ratioWeight * color + (1 - RULES.ratioWeight) * fill));
      const { perfect, veryGood, good } = RULES.scoreTiers;
      const tier = failure || (score >= perfect ? 'perfect'
        : score >= veryGood ? 'veryGood' : score >= good ? 'good' : 'bad');
      const failed = Boolean(failure) || tier === 'bad';
      result = {
        metin: words[tier], puan: score, tasti: failure === 'spilled',
        hata: failed && !tutorial(), bardak: glassNo, gun: day, kademe: tier,
        renk: Math.round(100 * color), doluluk: Math.round(100 * fill),
        ifade: tier === 'perfect' ? 'mutlu' : failed ? 'saskin' : 'bekliyor'
      };
      lastResult = result;
      if (tier === 'perfect') perfects++;
      if (result.hata) mistakes++;
      totalScore += score;
      serveSound(tier);
      if (result.tasti) {
        droplets = Array.from({ length: 22 }, () => ({
          dx: (Math.random() - 0.5) * 420, dy: -40 - Math.random() * 220, size: 2 + Math.random() * 4.5
        }));
      }
      state = 'sonuc';
      resultAt = now;
      status.textContent = `${result.metin} ${score} ${words.points}. ${words.color} ${result.renk}%. ${words.fill} ${result.doluluk}%.`;
    }

    function frame() {
      requestAnimationFrame(frame);
      if (adPlaying) return;
      const now = clock();
      if (state === 'oyun') advancePour(now);
      if (state === 'sonuc' && now - resultAt >= RULES.resultMs &&
          now - titleStartedAt >= RULES.recordingTitleMs) {
        stopRecording(true);
        if (glassNo >= RULES.glassLimit || mistakes >= RULES.mistakeLimit) endDay();
        else nextGlass(now);
      }
      draw(now);
      if ((state === 'oyun' || state === 'sonuc') && cupFrames < 2 && ++cupFrames === 2) {
        // Kayıt, yeni bardak tuvalde bir tam kare göründükten sonra başlar.
        recordGlass();
      }
      if (!pausedFrom && recording) {
        const { recorder } = recording;
        // Keep the opening and the result, but skip long idle gaps between pours.
        const idle = state === 'oyun' && !pour && now - titleStartedAt >= RULES.recordingTitleMs;
        if (idle && recorder.state === 'recording') recorder.pause();
        if (!idle && recorder.state === 'paused') recorder.resume();
      }
    }

    canvas.addEventListener('pointerdown', e => {
      if (e.button !== 0 || state !== 'oyun') return;
      e.preventDefault();
      unlockAudio();
      if (beginPour(e.pointerId, clock())) canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointerup', e => releasePour(e.pointerId, clock()));
    for (const event of ['pointercancel', 'lostpointercapture']) {
      canvas.addEventListener(event, e => releasePour(e.pointerId, clock(), false));
    }
    window.addEventListener('keydown', e => {
      if (e.code === 'Escape') {
        if (pausedFrom) resumeGame();
        else if (state === 'oyun' || state === 'sonuc') pauseGame();
        else if (!adPending && (state === 'gunSonu' || state === 'help')) showMainMenu();
      }
      if (e.code !== 'Space' || state !== 'oyun' || (e.target instanceof HTMLButtonElement && e.target.matches(':focus-visible'))) return;
      e.preventDefault();
      if (e.repeat) return;
      unlockAudio();
      beginPour('space', clock());
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'Space' && pour?.input === 'space') {
        e.preventDefault();
        releasePour('space', clock());
      }
    });
    window.addEventListener('blur', () => {
      if (pour) releasePour(pour.input, clock(), false);
    });
    window.addEventListener('touchend', unlockAudio, { passive: true });
    window.addEventListener('click', unlockAudio);

    if (query.get('test') === '1') {
      window.__cay = {
        get state() { return state; },
        get gun() { return day; },
        get bardak() { return glassNo; },
        get hata() { return mistakes; },
        get puan() { return totalScore; },
        get sonSonuc() { return lastResult && { ...lastResult }; },
        get siparis() {
          return glassNo ? { tur: order.id, cay: order.tea, metin: orderText() } : null;
        },
        get sdkOrtami() { return cg.environment; },
        get kayitBicimi() { return recordingFormat(); },
        get kesitSayisi() { return session?.clips.length ?? 0; },
        get kesitler() {
          return session?.clips.map(({ id, bardak, puan, format, blob }) =>
            ({ id, bardak, puan, format, bayt: blob.size })) ?? [];
        },
        async otomatik(demMs, suMs) {
          if (![demMs, suMs].every(ms => Number.isFinite(ms) && ms >= 0)) return false;
          if (state !== 'oyun' || pour) return false;
          const owner = session;
          const cup = glassNo;
          const current = () => session === owner && glassNo === cup && state === 'oyun' && !pour;
          const wait = glassStartedAt + RULES.orderWaitMs - clock();
          if (wait > 0) await new Promise(resolve => setTimeout(resolve, wait + 1));
          if (!current()) return false;
          const input = Symbol();
          const hold = ms => new Promise(resolve => {
            const now = clock();
            if (!beginPour(input, now, now + ms, resolve)) resolve();
          });
          if (stage === 1) {
            if (!demMs && !tea) return false;
            await hold(demMs);
          }
          if (current() && stage === 2) await hold(suMs);
          return session === owner && glassNo === cup && state === 'sonuc';
        }
      };
    }

    function setLanguage(locale) {
      const override = query.get('lang');
      const language = override === 'tr' || override === 'en' ? override
        : /^tr(?:[-_]|$)/i.test(locale) ? 'tr' : 'en';
      words = WORDS[language];
      document.documentElement.lang = language;
      document.title = words.name;
      canvas.setAttribute('aria-label', words.area);
    }

    async function boot() {
      resizeBackingCanvas();
      setLanguage(navigator.language);
      draw(clock());
      await cg.init();
      cg.loadingStart();
      const info = cg.environment === 'crazygames' ? cg.systemInfo() : null;
      if (info) setLanguage(info.locale || info.countryCode || navigator.language);
      cg.settings(settings => {
        sdkMuted = settings?.muteAudio === true;
        applyAudioSettings();
      });
      showMainMenu();
      draw(clock());
      cg.loadingStop();
      requestAnimationFrame(frame);
    }

    boot();
  </script>
</body>
</html>
